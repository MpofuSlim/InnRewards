version: 2
updates:

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    target-branch: "master"
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      spring-ecosystem:
        patterns:
          - "org.springframework*"
          - "org.springframework.boot*"
          - "org.springframework.cloud*"
          - "org.springframework.security*"
        update-types: ["minor", "patch"]
      jackson:
        patterns:
          - "com.fasterxml.jackson*"
          - "tools.jackson*"
        update-types: ["minor", "patch"]
      netty:
        patterns:
          - "io.netty*"
        update-types: ["minor", "patch"]
      testcontainers:
        patterns:
          - "org.testcontainers*"
        update-types: ["minor", "patch"]
      observability:
        patterns:
          - "io.micrometer*"
          - "io.opentelemetry*"
          - "io.sentry*"
          - "net.logstash.logback*"
        update-types: ["minor", "patch"]

  # Single-service repo: the Dockerfile lives at the repo root, not under a
  # per-service subdirectory as it did in the monorepo.
  - package-ecosystem: "docker"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "08:00", timezone: "Etc/UTC" }
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
    commit-message: { prefix: "docker" }
    # A JDK major is a deliberate move, never a Dependabot bump: the image JDK
    # (eclipse-temurin:25) and CI's java-version (.github/workflows/ci.yml) must
    # move in the SAME PR, or a green CI stops proving the image works. It also
    # keeps us off non-LTS majors (26, 27) past their short support window — the
    # trap ticketing-system hit when six images moved to non-LTS 24 (#621-#630).
    # Remove this ignore only in the PR that moves both to the next LTS.
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      docker-actions:
        patterns:
          - "docker/*"
