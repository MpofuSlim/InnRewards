spring:
  application:
    name: loyalty-service
  data:
    web:
      pageable:
        max-page-size: ${PAGEABLE_MAX_PAGE_SIZE:100}
        default-page-size: ${PAGEABLE_DEFAULT_PAGE_SIZE:20}
    # Shared Redis — read side of the cross-service logout denylist only (no
    # Spring Data Redis repositories). Same Redis the gateway / user-service /
    # payment / seat / booking services use.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loyalty_service}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: loyalty-service-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: false
    locations: classpath:db/migration

  lifecycle:
    timeout-per-shutdown-phase: 30s

user-service:
  base-url: http://user-service
  connect-timeout-ms: ${USER_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${USER_SERVICE_READ_TIMEOUT_MS:5000}

# External WhatsApp gateway — fallback channel for the guest-checkout
# congratulations message (SMS primary). Same WHATSAPP_* env-var convention as
# booking-service / payment-service; not in Eureka, reached by explicit base-url.
whatsapp:
  base-url: ${WHATSAPP_GATEWAY_URL:http://localhost:8089}
  api-key: ${WHATSAPP_API_KEY:change-me-whatsapp-api-key}
  connect-timeout-ms: ${WHATSAPP_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${WHATSAPP_READ_TIMEOUT_MS:10000}

# InnBucks public notification API — SMS channel. Same API Gateway + BANK_API_*
# credentials as the payment rail (POST /auth/third-party for the bearer, then
# POST /api/notification/sms). Auth handled in SmsNotificationClient.
innbucks-notify:
  base-url: ${BANK_API_URL:https://staging.innbucks.co.zw}
  api-key: ${BANK_API_KEY:}
  username: ${BANK_API_USERNAME:}
  password: ${BANK_API_PASSWORD:}
  connect-timeout-ms: ${BANK_API_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${BANK_API_READ_TIMEOUT_MS:30000}
  # Branded HTML emails ON by default (the gateway renders the message field as
  # HTML). NOTIFY_HTML_ENABLED=false rolls back to plain text. LOGO_URL blank =
  # crisp CSS-drawn logo (preferred over a hosted PNG that can proxy faintly).
  html-enabled: ${NOTIFY_HTML_ENABLED:true}
  logo-url: ${NOTIFY_LOGO_URL:}

loyalty:
  # Multi-currency (design: USD base + ZAR + ZWG). The cell's supported-currency
  # allowlist — every write that accepts or defaults a currency validates against
  # it (UNSUPPORTED_CURRENCY, fail closed). The effective set always includes the
  # BASE (USD) and this cell's INNBUCKS_CURRENCY. Enabling a currency here does
  # NOT make it priceable: pricing additionally needs an in-force USD→X row in
  # `exchange_rates` (NO_FX_RATE otherwise), and earn/redeem stay BASE-only until
  # the FX-anchoring PRs land. ZW go-live value: USD,ZAR,ZWG.
  currency:
    supported: ${LOYALTY_SUPPORTED_CURRENCIES:USD}
  fx:
    # Sanity band on POST /loyalty/exchange-rates: a new rate deviating more
    # than this many percent from the current in-force rate is refused
    # (FX_RATE_OUT_OF_BAND) unless force=true is sent WITH a note. Guards a
    # fat-fingered ZWG rate; non-positive disables the band.
    max-change-percent: ${LOYALTY_FX_MAX_CHANGE_PERCENT:25}
  pending:
    # Days a PENDING projection may sit before the expiry sweeper ages it out to
    # INACTIVE. Previously a code-only default with no env binding, so an
    # operator had no way to change it — which mattered once it emerged that the
    # registration signal these accounts were waiting for did not exist for the
    # customer app, and every one of them was on a 90-day clock to a state
    # nothing recovered.
    #
    # Since V40 the sweeper only ages out phones with NO registration, and a
    # later proof revives an aged-out row, so this is no longer a deadline for
    # customers who eventually register. Raise it (or set it very high) while a
    # registration integration is still being rolled out.
    ttl-days: ${LOYALTY_PENDING_TTL_DAYS:90}
  registration:
    partner:
      # The channel by which a trusted partner backend tells loyalty that a
      # phone's owner has proven they hold it (POST /loyalty/partner/registrations).
      #
      # FALSE by default and it must stay false in any shared/committed file.
      # Enable it per HOST in that host's gitignored cell.<iso>.local.env,
      # alongside the credential — the ConfigMap is shared by every host in the
      # cell, so a flag set there turns the endpoint on everywhere. Disabled =
      # 404, indistinguishable from no such route.
      enabled: ${LOYALTY_PARTNER_REGISTRATION_ENABLED:false}
      # assertion (default) | key
      #
      # assertion: the caller sends a short-lived, phone-scoped token signed with
      #   a private key only it holds; loyalty stores only the public key, so
      #   there is no credential here worth stealing and a captured assertion
      #   names one already-registered phone.
      # key: a shared secret in X-Partner-Key, for a partner that cannot sign.
      #   Weaker and honestly so — whoever holds the key can register ANY phone.
      #   Never ship it to a mobile client.
      auth-mode: ${LOYALTY_PARTNER_REGISTRATION_AUTH_MODE:assertion}
      # Verification key for assertion mode: the partner's PUBLIC key, X.509 /
      # SubjectPublicKeyInfo PEM. Blank fails SAFE — enabled with no key means
      # every call is refused 503 and a HALF-PROVISIONED error is logged at boot,
      # rather than the endpoint quietly accepting anything.
      public-key: ${LOYALTY_PARTNER_REGISTRATION_PUBLIC_KEY:}
      # Second accepted key, so rotating is an overlap rather than a cliff:
      # publish the new key here-and-current, cut the partner over, then clear.
      previous-public-key: ${LOYALTY_PARTNER_REGISTRATION_PREVIOUS_PUBLIC_KEY:}
      # Required iss / aud on the assertion. A token minted for some other relying
      # party — including a fleet JWT from a compromised sibling service — must
      # not double as a registration proof.
      issuer: ${LOYALTY_PARTNER_REGISTRATION_ISSUER:innbucks-app}
      audience: ${LOYALTY_PARTNER_REGISTRATION_AUDIENCE:innbucks-loyalty}
      # Ceiling on the assertion's own lifetime (exp - iat). Bounds the window in
      # which a captured assertion is worth anything; without it a partner could
      # mint one that never expires.
      max-ttl-seconds: ${LOYALTY_PARTNER_REGISTRATION_MAX_TTL_SECONDS:300}
      # Shared secret for key mode. Blank = the mode is unusable (503), which is
      # the right failure: a blank string must never compare equal to a missing
      # header. Real value belongs only in the gitignored per-host env file.
      key: ${LOYALTY_PARTNER_REGISTRATION_KEY:}
  points:
    # 0 (the default) = points NEVER expire: every credit opens a lot with a
    # NULL expires_at, which no expiry query matches, so nothing is released as
    # breakage and no "expires soon" nudge is ever sent. Was 30 days until V31.
    # Set a positive number to re-enable per-lot expiry for this cell — the
    # machinery is intact, just switched off. Only affects NEWLY earned points;
    # lots already carrying an expiry keep it (V31 cleared them for points
    # customers still held).
    expiry-days: ${LOYALTY_POINTS_EXPIRY_DAYS:0}
    # DEPRECATED (V35): the redemption rate now lives in the `redemption_rates`
    # table, set by SUPER_ADMIN via POST /loyalty/redemption-rate and read by
    # RedemptionRateService. This static key is no longer consulted by any code
    # path — the V35 seed carries the same default (100). Left here only so an
    # operator who still sets LOYALTY_POINTS_REDEEM_RATE sees why it has no
    # effect; remove once no cell env references it.
    redeem-rate: ${LOYALTY_POINTS_REDEEM_RATE:100}
  ticketing:
    # Default points per currency unit awarded on ticket purchases, applied when
    # auto-provisioning an organizer's merchant. Overridable via the rule API.
    default-earn-rate: ${LOYALTY_TICKETING_DEFAULT_EARN_RATE:1}
  earn:
    # Earn-integrity guards on staff-typed earns (channel TYPED_PHONE only —
    # QR consume is exempt by design, the scanner IS the recipient). Both
    # default ON; the env flags are an operational escape hatch.
    # self-block: refuse SELF_EARN — a cashier crediting their own phone.
    self-block: ${EARN_SELF_BLOCK:true}
    # require-reference: staff-typed PURCHASE / CARD_PAYMENT earns must name a
    # receipt reference, so every earn reconciles against a till sale.
    require-reference: ${EARN_REQUIRE_REFERENCE:true}
    # staff-recipient-block: refuse staff-typed earns to ANY staff phone of the
    # same merchant (colleague-crediting). Staff set comes from user-service's
    # internal shop-staff endpoint; unreachable = guard degrades open (SELF_EARN
    # still covers the caller's own phone, no network needed).
    staff-recipient-block: ${EARN_STAFF_RECIPIENT_BLOCK:true}
    # TTL of the per-merchant staff-phone cache: one lookup per merchant per
    # window; also the propagation delay for staff-list changes and the
    # degraded window after a failed lookup.
    staff-cache-seconds: ${EARN_STAFF_CACHE_SECONDS:300}
  adjustment:
    # Ceilings on manual point adjustments (POST /loyalty/transactions/adjust).
    # Adjustment is the ONLY path that mints points from nothing — earning is
    # bounded by a real transaction amount and a rule's earn rate, redemption by
    # the balance — so without these a single SHOP_ADMIN can credit any figure
    # to any account in their tenant, including one they control, and redeem it
    # immediately. Every other control on this path (postedBy attribution, the
    # customer notification, the reports) only tells you afterwards.
    #
    # SUPER_ADMIN is exempt from both: the aim is to make large corrections
    # require someone accountable, not to make them impossible.
    #
    # Both compare the ABSOLUTE movement — a large debit is as much a red flag
    # as a large credit — and the daily figure sums absolute values, so posting
    # +N then -N cannot present as a day of zero activity.
    #
    # Set either to 0 to disable that half. Tune to the largest correction a
    # shop manager should be able to make unaided.
    max-per-adjustment: ${LOYALTY_MAX_PER_ADJUSTMENT:5000}
    max-daily-per-operator: ${LOYALTY_MAX_DAILY_ADJUSTMENT_PER_OPERATOR:20000}
  reconciliation:
    # Daily integrity check: wallet.balance must equal sum(points_ledger.delta).
    # auto-fix=false is detection-only (ERROR log + loyalty.reconciliation.drift
    # metric); flip to true to let the job rebuild a drifting balance from the
    # ledger (the source of truth). Keep it off until you trust the ledger side.
    auto-fix: ${LOYALTY_RECONCILIATION_AUTO_FIX:false}
  voucher:
    secret: ${LOYALTY_VOUCHER_SECRET:change-me-voucher-secret-change-me-voucher-secret}
    default-validity-days: ${LOYALTY_VOUCHER_DEFAULT_VALIDITY_DAYS:365}
    fraud-velocity-threshold: ${LOYALTY_FRAUD_VELOCITY_THRESHOLD:5}
    fraud-window-seconds: ${LOYALTY_FRAUD_WINDOW_SECONDS:60}
  qr:
    secret: ${LOYALTY_QR_SECRET:change-me-qr-secret-change-me-qr-secret-change-me}
    ttl-seconds: ${LOYALTY_QR_TTL_SECONDS:300}
  integration:
    mpesa-enabled: ${LOYALTY_MPESA_ENABLED:false}
  invoice:
    prefix: ${LOYALTY_INVOICE_PREFIX:INV}
  scheduler:
    expiry-cron: ${LOYALTY_EXPIRY_CRON:0 5 * * * *}
    invoice-cron: ${LOYALTY_INVOICE_CRON:0 30 1 * * *}
    points-expiry-cron: ${LOYALTY_POINTS_EXPIRY_CRON:0 15 * * * *}
    reconciliation-cron: ${LOYALTY_RECONCILIATION_CRON:0 45 2 * * *}
    # Daily "expires soon" nudges (ExpiryWarningSweeper): points + vouchers
    # entering the warning window get one notification each. 08:00 UTC =
    # mid-morning in ZW (UTC+2) — a humane send time.
    expiry-warning-cron: ${LOYALTY_EXPIRY_WARNING_CRON:0 0 8 * * *}
  expiry-warning:
    days: ${LOYALTY_EXPIRY_WARNING_DAYS:7}
  public-test:
    # TEST-ONLY unauthenticated endpoints under /loyalty/public/** — no bearer
    # token, no X-Tenant-Id. They exist so a frontend can be built against real
    # data before its auth flow is wired up.
    #
    # FALSE by default and it must stay false in any shared/committed file: with
    # the switch ON, anyone who can guess a phone number can READ that
    # customer's history AND SPEND their points and vouchers. Enable it per HOST,
    # in that host's gitignored cell.<iso>.local.env, and only on a non-production
    # host. loyalty-service logs a boot WARN whenever it comes up enabled.
    enabled: ${LOYALTY_PUBLIC_TEST_ENABLED:false}
    # Optional pins for the points writes, which need one tenant (and a
    # merchant) named up front.
    #
    # tenant-id: leave blank and the acting projection is resolved per request
    # (ACTIVE first, then oldest). It no longer refuses a phone that spans
    # tenants — wallets are global per phone, so the choice changes only ledger
    # attribution. Set it to force one tenant; a phone with no projection there
    # then 404s.
    #
    # merchant-id: still refused with AMBIGUOUS_MERCHANT when the tenant has
    # several and the request names none, because which merchant is paid does
    # change the outcome.
    tenant-id: ${LOYALTY_PUBLIC_TEST_TENANT_ID:}
    merchant-id: ${LOYALTY_PUBLIC_TEST_MERCHANT_ID:}

innbucks:
  country: ${INNBUCKS_COUNTRY:ZW}
  currency: ${INNBUCKS_CURRENCY:USD}
  internal-api-token: ${INTERNAL_API_TOKEN:change-me-internal-token-change-me-internal-token}

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs

server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful
  # Never leak internals to clients on the fallback /error path (stack traces,
  # raw exception messages, binding-error detail). Handled errors already return
  # the ApiResult envelope via GlobalExceptionHandler — incl. field-level
  # validation detail — so this only sanitises the unhandled fallthrough.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}


# Static token the Prometheus scraper (in the ticketing cell's monitoring
# stack) presents on X-Metrics-Token to read /actuator/prometheus (see
# MetricsScrapeAuthFilter). Blank (the default) fail-closes: the endpoint
# stays JWT-401 and scraping is off until the cell provisions
# METRICS_SCRAPE_TOKEN — same value fleet-wide, lock-step with
# ticketing-system's prometheus/prometheus.yml loyalty-service job.
monitoring:
  scrape-token: ${METRICS_SCRAPE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACE_SAMPLE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{country:-},%X{homeCountry:-},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"

jwt:
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
  # OWASP A02 stage-1 RS256/JWKS dual-verify. When JWT_PUBLIC_KEY is set this
  # service verifies BOTH HS256 and RS256 tokens (alg selected per-token); unset
  # = HS256 only, as before. Set fleet-wide BEFORE user-service flips to RS256
  # minting. PKCS#8/X.509 PEM (-----BEGIN PUBLIC KEY-----).
  public-key: ${JWT_PUBLIC_KEY:}
  expiration: ${JWT_EXPIRATION_MS:86400000}

---
# OWASP A05: in a deployed cell each backend serves its OpenAPI SPEC ONLY
# (/v3/api-docs) so the gateway can aggregate it — the interactive Swagger UI
# stays OFF here. The gateway hosts the single UI behind an HTTP Basic login
# (SWAGGER_PASSWORD), which also gates the proxied /*-service/v3/api-docs paths
# and fails closed when unset. Backends are never published at the edge (gateway
# only), so the spec is reachable only in-cluster or via that gated proxy.
# dev/test keep the full UI on for local use.
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

---
# -- Email transport (Amazon SES over SMTP) -----------------------------------
# The InnBucks notification API composes the From header itself, so mail sent
# through it arrives as "Online Banking" whatever product it belongs to.
# Sending our own SMTP message is the only way loyalty mail can say "Foundry".
#
# Its own YAML document (no on-profile) so it applies to every profile without
# colliding with the top-level spring:/app: keys above — a duplicate key in one
# document is a parse error.
#
# Inactive by default twice over: Spring only auto-configures a JavaMailSender
# when spring.mail.host is set, and SmtpEmailSender also requires
# app.mail.enabled=true. With both unset, delivery is unchanged.
spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
# Mail must NEVER gate readiness. The probe hits the AGGREGATE /actuator/health,
# and Boot's MailHealthIndicator opens a real connection to spring.mail.host —
# empty on a cell without SES, so the component reports DOWN, the aggregate 503s
# and the pod never becomes ready (this took user-service out on 2026-07-29).
# Email is best-effort with a notification-API fallback, so an unreachable SMTP
# host must not pull the service out of rotation.
management:
  health:
    mail:
      enabled: false
app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    # Must be an SES-verified identity for the region or SES rejects the send.
    from: ${MAIL_FROM:banking@innbucks.co.zw}
    sender-name: ${MAIL_SENDER_NAME:Foundry}
